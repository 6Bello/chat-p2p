<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat P2P</title>
<style>
  /* Palette: carta fredda + inchiostro blu notte. L'accento (blu cavo) è riservato ai tuoi messaggi e al collegamento. */
  :root {
    --bg: #e9edf2;
    --surface: #ffffff;
    --ink: #14202b;
    --muted: #5d6b7a;
    --line: #cbd3dc;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --wait: #a8690f;
    --err: #b3261e;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141b;
      --surface: #19232e;
      --ink: #e6ecf2;
      --muted: #94a3b3;
      --line: #2c3a48;
      --accent: #6f90ff;
      --accent-ink: #0b1220;
      --wait: #e0a64a;
      --err: #ff8a80;
      color-scheme: dark;
    }
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 var(--font);
    display: flex;
    justify-content: center;
  }
  .shell {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  /* ---------- Collegamento: l'unico elemento "firma" della pagina ---------- */
  .top { padding: 20px 0 14px; border-bottom: 1px solid var(--line); }
  .link { display: flex; align-items: center; gap: 14px; }
  .end { display: flex; flex-direction: column; min-width: 0; }
  .end.right { align-items: flex-end; text-align: right; }
  .label { font-weight: 650; font-size: 1.05rem; letter-spacing: 0.01em; }
  .addr { font: 0.8rem/1.3 var(--mono); color: var(--muted); min-height: 1.05rem; overflow-wrap: anywhere; }
  .wire { position: relative; flex: 1; height: 2px; min-width: 40px; color: var(--wait); }
  .wire::before {            /* tratteggio in attesa */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, currentColor 0 8px, transparent 8px 16px);
    background-size: 16px 2px;
    animation: march 0.9s linear infinite;
  }
  .wire::after {             /* linea piena: compare quando il buco nel NAT è aperto */
    content: ""; position: absolute; inset: -1px 0; height: 4px; border-radius: 2px;
    background: var(--accent); transform: scaleX(0); transform-origin: center;
  }
  .wire.on { color: var(--accent); }
  .wire.on::before { animation: none; opacity: 0; }
  .wire.on::after { transform: scaleX(1); animation: join 0.7s cubic-bezier(.2,.7,.2,1); }
  .wire.idle { color: var(--muted); }
  .wire.idle::before { animation: none; opacity: 0.6; }
  .wire.off { color: var(--err); }
  .wire.off::before { animation: none; opacity: 0.55; }
  @keyframes march { to { background-position: 16px 0; } }
  @keyframes join { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .statebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; min-height: 34px; }
  .state { margin: 0; font-size: 0.9rem; color: var(--muted); }
  .state.on { color: var(--accent); }
  .state.off { color: var(--err); }

  /* ---------- Dati di connessione ---------- */
  .setup { display: grid; gap: 14px; padding: 18px 0 8px; }
  .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
  }
  .field input.mono { font-family: var(--mono); font-size: 0.95rem; }
  .check { display: flex; align-items: flex-start; gap: 10px; font-size: 0.92rem; cursor: pointer; }
  .check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .check small { display: block; color: var(--muted); font-size: 0.8rem; }
  .setup .primary { justify-self: start; height: 44px; padding: 0 24px; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 14px; }
  .ghost:hover { border-color: var(--muted); }

  /* ---------- Conversazione ---------- */
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 2px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.theirs { align-self: flex-start; align-items: flex-start; }
  .bubble {
    margin: 0; padding: 9px 13px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .mine .bubble { background: var(--accent); color: var(--accent-ink); border-radius: 16px 16px 4px 16px; }
  .theirs .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; }
  .time { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

  .note { margin: 4px 0; text-align: center; font-size: 0.85rem; color: var(--muted); }
  .note.err { color: var(--err); font-weight: 600; }

  .file {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 0;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }
  .file .what { color: var(--muted); }
  .file .fname { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .file .fsize { font: 0.8rem var(--mono); color: var(--muted); white-space: nowrap; }
  .file a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .file a:hover { text-decoration: underline; }

  /* ---------- Trasferimenti in corso ---------- */
  #transfers:empty { display: none; }
  #transfers { padding: 6px 0 10px; display: flex; flex-direction: column; gap: 8px; }
  .tr .row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.85rem; }
  .tr .name { overflow-wrap: anywhere; }
  .tr .pct { font: 0.8rem var(--mono); color: var(--muted); white-space: nowrap; }
  .bar { height: 4px; background: var(--line); margin-top: 4px; overflow: hidden; border-radius: 2px; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }

  /* ---------- Barra di scrittura ---------- */
  #composer {
    display: flex; gap: 8px; align-items: center;
    padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
  }
  #text {
    flex: 1; min-width: 0; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px;
  }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 10px;
  }
  #attach {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center;
    background: transparent; color: var(--muted); border: 1px solid var(--line);
  }
  #attach:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  #send, .primary {
    height: 44px; padding: 0 20px; background: var(--accent); color: var(--accent-ink); font-weight: 650;
  }
  :disabled { opacity: 0.45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Rilascio file ---------- */
  #drop {
    position: fixed; inset: 12px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border: 2px dashed var(--accent); border-radius: 14px;
    font-size: 1.15rem; font-weight: 600; color: var(--accent); z-index: 10;
  }
  #drop[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .wire::before, .wire.on::after { animation: none; }
    .fill { transition: none; }
  }
  @media (max-width: 480px) {
    .msg { max-width: 90%; }
    .shell { padding: 0 12px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="link">
      <div class="end"><span class="label">Tu</span><span class="addr"></span></div>
      <div class="wire" id="wire"></div>
      <div class="end right"><span class="label">Peer</span><span class="addr" id="peerAddr"></span></div>
    </div>
    <div class="statebar">
      <p class="state" id="stateText" aria-live="polite">Inserisci i dati per collegarti</p>
      <button type="button" class="ghost" id="cancel" hidden>Annulla</button>
    </div>
  </header>

  <form class="setup" id="setup" autocomplete="off" hidden>
    <div class="field">
      <label for="srv">Indirizzo del server</label>
      <input class="mono" id="srv" type="text" placeholder="192.168.1.10" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="room">Nome della stanza</label>
      <input id="room" type="text" placeholder="lo stesso per entrambi i peer" spellcheck="false"
             pattern="[A-Za-z0-9_.-]{1,64}" title="Lettere, numeri, punto, trattino e underscore" required>
    </div>
    <label class="check">
      <input type="checkbox" id="lan">
      <span>Server e peer sono nella stessa rete locale
        <small>Attivalo solo se tutti e due siete collegati allo stesso router del server.</small></span>
    </label>
    <button type="submit" class="primary" id="connectBtn">Connetti</button>
  </form>

  <main id="chat" role="log" aria-live="polite" aria-label="Conversazione"></main>
  <section id="transfers" aria-label="Trasferimenti in corso"></section>

  <form id="composer" autocomplete="off">
    <button type="button" id="attach" aria-label="Allega un file" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.6l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
    </button>
    <input type="file" id="fileInput" multiple hidden>
    <input type="text" id="text" placeholder="Scrivi un messaggio" aria-label="Messaggio" disabled>
    <button type="submit" id="send" disabled>Invia</button>
  </form>
</div>

<div id="drop" hidden>Rilascia il file per inviarlo</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), wire = $('wire'), stateText = $('stateText');
let lastId = -1, connected = false, prefilled = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  const u = ['KB', 'MB', 'GB'];
  let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < 2);
  return b.toFixed(b < 10 ? 1 : 0) + ' ' + u[i];
}
function push(node) {
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  chat.appendChild(node);
  if (nearBottom || node.classList.contains('mine')) chat.scrollTop = chat.scrollHeight;
}
function note(text, err) { push(el('p', 'note' + (err ? ' err' : ''), text)); }

/* ---------- Eventi dal programma Python ---------- */
function render(e) {
  if (e.kind === 'msg') {
    const m = el('div', 'msg ' + (e.who === 'me' ? 'mine' : 'theirs'));
    m.appendChild(el('p', 'bubble', e.text));
    m.appendChild(el('span', 'time', e.t));
    push(m);
  } else if (e.kind === 'status') {
    note(e.text);
  } else if (e.kind === 'error') {
    note(e.text, true);
  } else if (e.kind === 'file_in' || e.kind === 'file_out') {
    const incoming = e.kind === 'file_in';
    const row = el('div', 'file ' + (incoming ? 'theirs' : 'mine'));
    row.appendChild(el('span', 'what', incoming ? 'Ricevuto' : 'Inviato'));
    row.appendChild(el('span', 'fname', e.name));
    row.appendChild(el('span', 'fsize', fmtSize(e.size)));
    if (incoming) {
      const a = el('a', '', 'Salva');
      a.href = '/files/' + encodeURIComponent(e.file);
      a.setAttribute('download', e.name);
      row.appendChild(a);
    }
    push(row);
  }
}

function setPhase(phase, peerAddr, offline) {
  const was = connected;
  const up = phase === 'connected' && !offline;
  connected = up;
  wire.className = 'wire' + (offline ? ' off' : up ? ' on' : phase === 'connecting' ? '' : ' idle');
  stateText.className = 'state' + (offline ? ' off' : up ? ' on' : '');
  stateText.textContent = offline ? 'Il programma Python non risponde: controlla il terminale'
    : up ? 'Connesso, i messaggi viaggiano direttamente tra voi due'
    : phase === 'connecting' ? 'Collegamento in corso, in attesa dell\'altro peer'
    : 'Inserisci i dati per collegarti';
  $('peerAddr').textContent = up ? peerAddr : '';
  $('setup').hidden = offline || phase !== 'setup';
  $('cancel').hidden = offline || phase !== 'connecting';
  for (const id of ['text', 'send', 'attach']) $(id).disabled = !up;
  if (up && !was) $('text').focus();
}

function renderTransfers(list) {
  const box = $('transfers');
  box.textContent = '';
  for (const t of list) {
    const pct = t.total ? Math.min(100, Math.round(t.done / t.total * 100)) : 0;
    const row = el('div', 'tr');
    const head = el('div', 'row');
    head.appendChild(el('span', 'name', (t.dir === 'out' ? 'Invio di ' : 'Ricezione di ') + t.name));
    head.appendChild(el('span', 'pct', pct + '%'));
    const bar = el('div', 'bar');
    const fill = el('div', 'fill');
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    row.appendChild(head);
    row.appendChild(bar);
    box.appendChild(row);
  }
}

const es = new EventSource('/events');
es.addEventListener('log', ev => {
  const e = JSON.parse(ev.data);
  if (e.id <= lastId) return;          // dopo una riconnessione il server rimanda la cronologia
  lastId = e.id;
  render(e);
});
es.addEventListener('snapshot', ev => {
  const s = JSON.parse(ev.data);
  if (!prefilled) {              // precompila il modulo con gli ultimi valori usati
    prefilled = true;
    if (s.config) {
      $('srv').value = s.config.server || '';
      $('room').value = s.config.room || '';
      $('lan').checked = !!s.config.lan;
    }
    if (s.phase === 'setup') ($('srv').value ? $('room') : $('srv')).focus();
  }
  setPhase(s.phase, s.peer, false);
  renderTransfers(s.transfers);
});
es.onerror = () => setPhase('setup', '', true);

/* ---------- Invio ---------- */
async function post(url, opts) {
  try {
    const r = await fetch(url, Object.assign({ method: 'POST' }, opts));
    if (!r.ok) {
      let msg = 'Richiesta non riuscita';
      try { msg = (await r.json()).error || msg; } catch (_) {}
      note(msg, true);
    }
  } catch (_) {
    note('Impossibile contattare il programma Python', true);
  }
}

$('setup').addEventListener('submit', ev => {
  ev.preventDefault();
  post('/api/connect', {
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ server: $('srv').value.trim(), room: $('room').value.trim(), lan: $('lan').checked })
  });
});
$('cancel').addEventListener('click', () => post('/api/cancel', {}));

$('composer').addEventListener('submit', ev => {
  ev.preventDefault();
  const input = $('text');
  const text = input.value.trim();
  if (!text || !connected) return;
  input.value = '';
  post('/api/msg', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
});

function sendFiles(files) {
  if (!connected) { note('Aspetta che il peer sia connesso prima di inviare un file', true); return; }
  for (const f of files) {
    post('/api/send_file', { headers: { 'X-Filename': encodeURIComponent(f.name) }, body: f });
  }
}
$('attach').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => { sendFiles(e.target.files); e.target.value = ''; });

/* Trascinamento file sulla pagina */
let depth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; $('drop').hidden = false; } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; $('drop').hidden = true; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  depth = 0; $('drop').hidden = true;
  sendFiles(e.dataTransfer.files);
});
</script>
</body>
</html>
